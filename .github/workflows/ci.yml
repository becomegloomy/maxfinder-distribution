name: Build, Test, Package, Docker and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make dpkg

      - name: Build binary
        run: make clean && make

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: findmax-binary
          path: findmax

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: findmax-binary

      - name: Make executable
        run: chmod +x findmax tests/test.sh

      - name: Run tests
        run: ./tests/test.sh

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make dpkg

      - uses: actions/download-artifact@v4
        with:
          name: findmax-binary

      - name: Make executable
        run: chmod +x findmax

      - name: Build deb package
        run: make deb

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: findmax-deb
          path: "*.deb"

  docker:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/findmax:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          echo -e "5\n1 5 3 9 2" | docker run -i --rm ${{ secrets.DOCKER_USERNAME }}/findmax:${{ github.sha }} | grep "Max value: 9"

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/findmax:${{ github.sha }}

  release:
    runs-on: ubuntu-latest
    needs: [package, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: findmax-deb

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
